# 将 GitHub 仓库镜像同步到 CNB（Gitee 由平台自带的仓库同步功能处理，无需在此同步）。
# 需要在仓库 Settings → Secrets and variables → Actions 中配置：
#   CNB_PUSH_URL  形如 https://<用户名>:<访问令牌>@cnb.cool/<group>/<repo>.git
# 未配置时会被跳过（便于 fork 直接使用），配置后推送失败会以红色状态提示。

name: Sync CNB

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

# 连续推送时只保留最新一次同步，避免旧提交后到覆盖新提交
concurrency:
  group: sync-cnb
  cancel-in-progress: true

jobs:
  sync:
    name: Sync to CNB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # 固定以远端 main 为准：打 tag 触发时 HEAD 可能指向旧提交，不能直接推 HEAD
      - name: Resolve main branch
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Push to CNB
        env:
          GIT_TERMINAL_PROMPT: '0'
          PUSH_URL: ${{ secrets.CNB_PUSH_URL }}
        run: |
          if [ -z "$PUSH_URL" ]; then
            echo "::notice title=跳过 CNB 同步::未配置 CNB_PUSH_URL"
            exit 0
          fi
          git push --force --tags "$PUSH_URL" "refs/remotes/origin/main:refs/heads/main"
