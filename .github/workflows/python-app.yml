name: Build StarRailAssistant

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  pre_check:
    name: Pre Checks
    runs-on: ubuntu-latest
    steps:
      - name: Repo Check
        run: |
          if [[ "$GITHUB_REPOSITORY" != "Shasnow/StarRailAssistant" ]]; then
            echo "When forking this repository to make your own builds, you have to adjust this check."
            exit 1
          fi
          exit 0
  build:
    name: Build StarRailAssistant
    needs: pre_check
    # 构建逻辑抽到可复用工作流，同时支持单独手动触发（不发布 release）
    uses: ./.github/workflows/build-artifacts.yml

  publish_release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: StarRailAssistant_*
          merge-multiple: true
          path: artifacts
      - name: Download Version_Info
        uses: actions/download-artifact@v4
        with:
          name: version_info
          path: ./
      - name: Check if release exists
        id: check_if_release_exists
        run: |
          release_id=$(gh release view $(sed 's/\r$//g' <(head -n 1 version_info.txt)) --json id --jq .id || true)
          if [[ -z $release_id ]]; then
            echo "release_exists=false" >> $GITHUB_OUTPUT
          else
            echo "release_exists=true" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
      - name: Create release
        id: create_release
        if: steps.check_if_release_exists.outputs.release_exists == 'false'
        run: |
          set -xe
          shopt -s nullglob
          NAME="$(sed 's/\r$//g' <(head -n 1 version_info.txt))"
          TAGNAME="$(sed 's/\r$//g' <(head -n 1 version_info.txt))"
          NOTES_MAIN="$(sed 's/\r$//g' <(tail -n +3 version_info.txt))"
          NOTES="$NOTES_MAIN

          \`\`\`本release通过GitHub Actions自动构建\`\`\`"
          gh release create "$TAGNAME" --target "main" --title "$NAME" --notes "$NOTES" --prerelease artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
      - name: Update release
        if: steps.check_if_release_exists.outputs.release_exists == 'true'
        run: |
          set -xe
          shopt -s nullglob
          NAME="$(sed 's/\r$//g' <(head -n 1 version_info.txt))"
          TAGNAME="$(sed 's/\r$//g' <(head -n 1 version_info.txt))"
          NOTES_MAIN="$(sed 's/\r$//g' <(tail -n +3 version_info.txt))"
          NOTES="$NOTES_MAIN

          \`\`\`本release通过GitHub Actions自动构建\`\`\`"
          gh release delete "$TAGNAME" --yes
          gh release create "$TAGNAME" --target "main" --title "$NAME" --notes "$NOTES" --prerelease artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}

  mirrorchyan:
    needs: publish_release
    runs-on: macos-latest
    if: ${{ github.repository_owner == 'Shasnow' }}
    steps:
      - name: upload
        uses: MirrorChyan/uploading-action@v1
        with:
          filetype: latest-release
          filename: "StarRailAssistant_v*.zip"
          mirrorchyan_rid: StarRailAssistant

          github_token: ${{ secrets.GITHUB_TOKEN }}
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          upload_token: ${{ secrets.MirrorChyanUploadToken }}

      - name: release note
        uses: MirrorChyan/release-note-action@v1
        with:
          mirrorchyan_rid: StarRailAssistant

          upload_token: ${{ secrets.MirrorChyanUploadToken }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  auto_mas:
    runs-on: ubuntu-latest
    needs: mirrorchyan
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read version
        id: meta
        run: |
          VERSION=$(node -p '"v" + require("./package.json").version')
          CHANNEL=$([[ "$VERSION" == *"-beta"* ]] && echo "beta" || echo "stable")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
      - name: Download full zip artifact
        uses: actions/download-artifact@v4
        with:
          name: StarRailAssistant_${{ steps.meta.outputs.version }}
          path: package
      - name: Push to data center
        env:
          STABLE_FILE_ID: ${{ vars.DATACENTER_RELEASE_STABLE_FILE_ID }}
          BETA_FILE_ID: ${{ vars.DATACENTER_RELEASE_BETA_FILE_ID }}
          FILE_UPDATE_SHA256: ${{ vars.DATACENTER_FILE_UPDATE_SHA256 }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          CHANNEL="${{ steps.meta.outputs.channel }}"
          PKG="package/StarRailAssistant_${VERSION}.zip"
          test -f "$PKG" || { echo "Package not found: $PKG"; exit 1; }

          if [[ "$CHANNEL" == "beta" ]]; then
            TARGETS=(--file-id "$BETA_FILE_ID")
          else
            TARGETS=(--file-id "$STABLE_FILE_ID" --file-id "$BETA_FILE_ID")
          fi

          curl -fsSL --proto '=https' --tlsv1.2 -o file_update.sh https://data.auto-mas.top/api/v1/tools/file_update.sh
          echo "${FILE_UPDATE_SHA256:?vars.DATACENTER_FILE_UPDATE_SHA256 is not set}  file_update.sh" | sha256sum -c -
          AUTOMAS_TOKEN="${{ secrets.DATACENTER_ACCESS_KEY }}" bash file_update.sh "$PKG" "${TARGETS[@]}" --change-note "$VERSION"
