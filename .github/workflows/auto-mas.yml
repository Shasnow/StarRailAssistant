name: auto-mas.yml
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auto_mas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read version
        id: meta
        run: |
          VERSION=$(node -p '"v" + require("./package.json").version')
          CHANNEL=$([[ "$VERSION" == *"-beta"* ]] && echo "beta" || echo "stable")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
      # 本工作流独立触发，没有 build job，产物需从 GitHub Release 取
      - name: Download release asset
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "${{ steps.meta.outputs.version }}" \
            --pattern "StarRailAssistant_${{ steps.meta.outputs.version }}.zip" \
            --dir package
      - name: Push to data center
        env:
          DATACENTER_ACCESS_KEY: ${{ secrets.DATACENTER_ACCESS_KEY }}
          STABLE_FILE_ID: ${{ vars.DATACENTER_RELEASE_STABLE_FILE_ID }}
          BETA_FILE_ID: ${{ vars.DATACENTER_RELEASE_BETA_FILE_ID }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          CHANNEL="${{ steps.meta.outputs.channel }}"
          PKG="package/StarRailAssistant_${VERSION}.zip"
          test -f "$PKG" || { echo "Package not found: $PKG"; exit 1; }
          push_version() {
            echo "Uploading ${PKG} to file ${1}"
            curl -sS --fail --show-error -X POST \
              "https://data.auto-mas.top/api/v1/user/files/${1}/versions" \
              -H "Authorization: Bearer ${DATACENTER_ACCESS_KEY}" \
              -F "file=@${PKG};type=application/zip"
            echo
          }
          # 预发布只推 beta；正式版 stable 与 beta 都推
          if [[ "$CHANNEL" == "beta" ]]; then
            push_version "$BETA_FILE_ID"
          else
            push_version "$STABLE_FILE_ID"
            push_version "$BETA_FILE_ID"
          fi
